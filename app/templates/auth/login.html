{% extends "base.html" %}

{% block title %}Login | AI Interview Preparation Assistant{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-copy">
    <p class="eyebrow">Welcome back</p>
    <h1>Continue your placement preparation.</h1>
    <p>Log in to save attempts, view scores, and track your progress by category.</p>
  </div>

  <form class="auth-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button class="primary-button" type="submit">Login</button>
    <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
