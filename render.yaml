services:
  - type: web
    name: ai-interview-preparation-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-preparation-db
          property: connectionString

databases:
  - name: ai-interview-preparation-db
    plan: free
    databaseName: interview_assistant
    user: interview_user
